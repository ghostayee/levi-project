    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #09090b;
      color: #fff;
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* ===== Top bars ===== */
    .fixed-top-menu {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: #0A3D1F;
      border-bottom: 1px solid #166534;
      overflow: hidden;
      white-space: nowrap;
      height: 40px;
      display: flex;
      align-items: center;
    }

    .fixed-top-menu .scroll-track {
      display: inline-flex;
      gap: 40px;
      min-width: max-content;
      animation: infiniteScroll 20s linear infinite;
    }

    .fixed-top-menu:hover .scroll-track {
      animation-play-state: paused;
    }

    .fixed-top-menu a:hover {
      color: #fcd34d;
    }

    @keyframes infiniteScroll {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    .fixed-top-menu a {
      flex-shrink: 0;
      animation: topMenuScroll 80s linear infinite;
    }

    .fixed-top-menu:hover a {
      animation-play-state: paused;
      transform: scale(1.08);
    }

    @keyframes topMenuScroll {
      from {
        transform: translateX(100vw);
      }

      to {
        transform: translateX(-120vw);
      }
    }

    .orange-header {
      position: fixed;
      top: 38px;
      left: 0;
      right: 0;
      z-index: 999;
      background: #F59E0B;
      border-bottom: 2px solid #15803D;
      padding: 12px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand .logo {
      font-size: 20px;
      font-weight: 800;
      color: #052e16;
    }

    .brand .tag {
      background: #052e16;
      color: #fcd34d;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .orange-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 14px;
      font-weight: 600;
      color: #052e16;
    }

    .orange-nav a:hover {
      color: #fff;
    }

    .secondary-menu {
      position: fixed;
      top: 96px;
      left: 0;
      right: 0;
      z-index: 998;
      background: #15803D;
      border-bottom: 1px solid #166534;
      padding: 8px 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      font-size: 14px;
      font-weight: 500;
      color: #fff;
    }

    .secondary-menu a:hover {
      color: #fcd34d;
    }

    /* ===== Sidebar ===== */
    .vertical-sidebar {
      position: fixed;
      top: 136px;
      left: 0;
      width: 280px;
      height: calc(100vh - 136px);
      overflow-y: auto;
      background: linear-gradient(to bottom, #0F2C1E, #0A3D1F);
      border-right: 3px solid #16A34A;
      z-index: 990;
      padding: 16px;
    }

    .vertical-sidebar h2 {
      font-size: 18px;
      font-weight: 700;
      color: #fcd34d;
      margin-bottom: 12px;
      padding: 0 8px;
    }

    .sidebar-card {
      display: block;
      padding: 12px 16px;
      border-radius: 10px;
      color: #e5e7eb;
      margin-bottom: 4px;
      transition: all 0.25s ease;
      font-size: 14px;
      cursor: pointer;
    }

    .sidebar-card:hover {
      background: #166534;
      transform: translateX(6px);
      color: #fff;
    }

    .sidebar-card.active {
      background: #16A34A;
      color: #052e16;
      font-weight: 700;
    }

    /* ===== Main ===== */
    main {
      margin-left: 280px;
      padding-top: 136px;
    }

    /* Hero rotating banner */
    .hero-section {
      position: relative;
      min-height: 45vh;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
      padding: 32px;
      transition: background-image 0.8s ease;
    }

    .hero-section::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, .75), rgba(0, 0, 0, .2));
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .hero-content h1 {
      font-size: 44px;
      font-weight: 800;
    }

    .hero-content p {
      color: #fcd34d;
      margin-top: 8px;
      font-size: 18px;
    }

    .banner-dots {
      position: absolute;
      bottom: 16px;
      right: 24px;
      z-index: 3;
      display: flex;
      gap: 8px;
    }

    .banner-dots button {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: rgba(255, 255, 255, .4);
      transition: .25s;
    }

    .banner-dots button.active {
      background: #fbbf24;
    }

    .banner-fade {
      animation: bannerFade .8s ease;
    }

    @keyframes bannerFade {
      from {
        opacity: 0;
        transform: scale(1.02);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Section content */
    .section-content {
      padding: 40px 24px;
      animation: sectionFade .4s ease;
    }

    @keyframes sectionFade {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .section-content h2 {
      font-size: 34px;
      font-weight: 800;
      color: #fcd34d;
    }

    .section-content .label {
      margin-top: 16px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #4ade80;
    }

    .section-content .intro {
      color: #d1d5db;
      margin-top: 8px;
      max-width: 720px;
      line-height: 1.65;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }

    .info-card {
      background: #fff;
      color: #111827;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .3);

    .info-card h4 {
      color: #14532d;
      font-size: 17px;
      margin-bottom: 8px;
    }

    .info-card p {
      color: #374151;
      font-size: 14px;

      padding-top: 20px;
      border-top: 1px solid rgba(20, 83, 45, .6);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;

      font-size: 13px;
      font-weight: 600;

      color: #052e16;

      border-radius: 16px;

      font-weight: 700;

      list-style: none;
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));

    .biz-list li {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      background: rgba(0, 0, 0, .3);
      border: 1px solid #166534;
      border-radius: 8px;

      line-height: 1.5;

        top: 0;

        border-bottom: 3px solid #16A34A;
      }

      main {
        margin-left: 0;
        padding-top: 136px;
      }

      .hero-content h1 {

</head>

      },
      {
        id: "jv", label: "JV & 30/21",
        intro: "Joint Ventures and special programs 30/21 for strategic co-investment.",
        cards: [
          { title: "JV Structure", text: "SPV design & governance." },
          { title: "30/21 Program", text: "Special framework." },
          { title: "Capital", text: "Equity & debt mix." },
          { title: "Exit", text: "Liquidity options." }],
        subMenu: ["Pipeline", "Governance", "Capital", "Exit"],
        bp: {
          title: "JV & 30/21 Business Plan Starter Kit", bullets: [
            "JV thesis & partner fit", "Cap table & governance",
            "Funding milestones", "Exit & return model"]
        }
      },
    ];

    /* ============ SIDEBAR ============ */
    const sidebarEl = document.getElementById('sidebar');
    let activeId = sections[0].id;

    function renderSidebar() {
      sidebarEl.innerHTML = sections.map(s =>
        `<a class="sidebar-card ${s.id === activeId ? 'active' : ''}" data-id="${s.id}">${s.label}</a>`
      ).join('');
      sidebarEl.querySelectorAll('.sidebar-card').forEach(el => {
        el.addEventListener('click', () => {
          activeId = el.dataset.id;
          renderSidebar();
          renderSection();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });
    }

    /* ============ SECTION ============ */
    const sectionEl = document.getElementById('sectionContent');
    function renderSection() {
      const s = sections.find(x => x.id === activeId);
      sectionEl.classList.remove('section-fade');
      void sectionEl.offsetWidth; // restart animation
      sectionEl.classList.add('section-fade');

      sectionEl.innerHTML = `
    <h2>${s.label}</h2>
    <div class="label">Introduction</div>
    <p class="intro">${s.intro}</p>

    <div class="card-grid">
      ${s.cards.map(c => `
        <article class="info-card">
          <h4>${c.title}</h4>
          <p>${c.text}</p>
        </article>`).join('')}
    </div>

    <div class="sub-menu">
      ${s.subMenu.map(m => `<a href="#">${m}</a>`).join('')}
    </div>

    <div class="biz-plan">
      <div class="biz-plan-head">
        <div>
          <h3>${s.bp.title}</h3>
          <p class="sub">Foundational pillars to launch a viable plan for <b>${s.label}</b>.</p>
        </div>
        <a href="#" class="cta" onclick="alert('Open full business plan: ${s.id}'); return false;">
          Open Full Business Plan →
        </a>
      </div>
      <ul class="biz-list">
        ${s.bp.bullets.map((b, i) => `
          <li><span class="num">${i + 1}</span><span class="txt">${b}</span></li>
        `).join('')}
      </ul>
    </div>
  `;
    }

    /* ============ ROTATING BANNER ============ */
    const heroEl = document.getElementById('hero');
    const titleEl = document.getElementById('bannerTitle');
    const subEl = document.getElementById('bannerSubtitle');
    const dotsEl = document.getElementById('bannerDots');
    let bannerIdx = 0;

    function renderDots() {
      dotsEl.innerHTML = banners.map((_, i) => `<button data-i="${i}" class="${i === bannerIdx ? 'active' : ''}"></button>`).join('');
      dotsEl.querySelectorAll('button').forEach(b => {
        b.addEventListener('click', () => { bannerIdx = +b.dataset.i; renderBanner(); });
      });
    }
    function renderBanner() {
      const b = banners[bannerIdx];
      heroEl.style.backgroundImage =
        `linear-gradient(to top, rgba(0,0,0,.75), rgba(0,0,0,.2)), url('${b.image}')`;
      titleEl.textContent = b.title;
      subEl.textContent = b.subtitle;
      heroEl.classList.remove('banner-fade');
      void heroEl.offsetWidth;
      heroEl.classList.add('banner-fade');
      renderDots();
    }
    setInterval(() => { bannerIdx = (bannerIdx + 1) % banners.length; renderBanner(); }, 5000);

    /* ============ INIT ============ */
    renderSidebar();
    renderSection();
    renderBanner();
  </script>
</body>

</html>
