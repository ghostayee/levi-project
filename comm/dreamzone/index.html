<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Dream.ZONE</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header class="dz-header">
		<div style="display:flex;align-items:center;gap:16px">
			<a class="dz-caller-back" href="..">Back</a>
			<div class="dz-logo">Dream<span>.ZONE</span></div>
		</div>
		<div class="dz-user-tools">
			<button id="btn-cart" class="dz-tool-btn dz-cart-btn">Cart <span id="cart-count" class="badge">0</span></button>
			<button id="btn-checkout" class="dz-tool-btn">Checkout</button>
		</div>
	</header>

	<div class="progress-container">
		<div class="progress-bar">
			<div id="step-1" class="progress-step active">1. KYC</div>
			<div id="step-2" class="progress-step">2. Generate</div>
			<div id="step-3" class="progress-step">3. Cart</div>
		</div>
	</div>

	<main class="main-content">
		<section id="view-kyc" class="step-view active">
			<div class="dz-card">
				<div class="card-title">KYC / Investor Details</div>
				<div class="card-subtitle">Provide details to proceed.</div>
				<div class="form-row">
					<div class="form-group">
						<label for="inp-name">Full name</label>
						<input id="inp-name" class="form-control" placeholder="Jane Doe">
					</div>
					<div class="form-group">
						<label for="inp-email">Email</label>
						<input id="inp-email" class="form-control" placeholder="you@example.com">
					</div>
				</div>
				<div style="margin-top:18px">
					<button id="btn-save-kyc" class="btn btn-primary">Save KYC</button>
				</div>
			</div>
		</section>

		<section id="view-generate" class="step-view">
			<div class="dz-card">
				<div class="card-title">Generator</div>
				<div class="card-subtitle">Create your assets.</div>
				<div class="generator-top">
					<div style="display:flex;gap:12px;align-items:center">
						<input id="inp-qty" class="form-control" style="width:120px" placeholder="Quantity">
						<button id="btn-generate" class="btn btn-primary">Generate</button>
						<button id="btn-pdf-all" class="btn btn-outline">Export PDF</button>
					</div>
				</div>
				<div id="nfw-grid" class="nfw-grid"></div>
			</div>
		</section>

		<section id="view-cart" class="step-view">
			<div class="dz-card">
				<div class="card-title">Cart</div>
				<div id="cart-list"></div>
				<div class="cart-total"> <div>Total</div> <div id="cart-total">$0.00</div> </div>
				<div style="margin-top:12px"><button id="btn-checkout-final" class="btn btn-primary btn-block">Checkout</button></div>
			</div>
		</section>
	</main>

	<footer style="text-align:center;padding:24px;color:#94a3b8">© Dream.ZONE</footer>

	<script>
		// Minimal wiring: change steps and maintain simple cart counter.
		document.addEventListener('DOMContentLoaded', () => {
			const steps = Array.from(document.querySelectorAll('.progress-step'))
			const views = Array.from(document.querySelectorAll('.step-view'))
			function changeStep(n){
				steps.forEach((s,i)=> s.classList.toggle('active', i===n))
				views.forEach((v,i)=> v.classList.toggle('active', i===n))
			}
			document.getElementById('step-1').addEventListener('click', ()=> changeStep(0))
			document.getElementById('step-2').addEventListener('click', ()=> changeStep(1))
			document.getElementById('step-3').addEventListener('click', ()=> changeStep(2))

			const btnGenerate = document.getElementById('btn-generate')
			const nfwGrid = document.getElementById('nfw-grid')
			const cartCount = document.getElementById('cart-count')
			let cart = []

			btnGenerate?.addEventListener('click', ()=>{
				const item = {id: Date.now(), title: 'Asset '+(cart.length+1), price: (Math.random()*10+1).toFixed(2)}
				cart.push(item)
				cartCount.textContent = cart.length
				const card = document.createElement('div')
				card.className = 'nfw-card'
				card.innerHTML = `<div style="padding:15px"><div style="font-weight:700">${item.title}</div><div style="color:#94a3b8">$${item.price}</div></div>`
				nfwGrid.appendChild(card)
			})

			document.getElementById('btn-save-kyc')?.addEventListener('click', ()=>{
				const name = document.getElementById('inp-name').value
				const email = document.getElementById('inp-email').value
				localStorage.setItem('dream.kyc', JSON.stringify({name,email}))
				alert('KYC saved')
			})
		})
	</script>

	<script src="assets/dreamzone-extras.js" defer></script>
</body>
</html>
