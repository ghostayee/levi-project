<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCRR-JWT Redirect Dispatcher</title>
    <style>
      body { margin: 0; min-height: 100vh; font-family: Inter, system-ui, sans-serif; color: #eef2ff; background: radial-gradient(circle at top, #111827, #0f172a 45%, #020617 100%); display: flex; align-items: center; justify-content: center; text-align: center; }
      .page { width: min(100%, 920px); padding: 28px; }
      h1 { font-size: clamp(2rem, 4vw, 3.2rem); margin: 0 0 1rem; letter-spacing: -0.04em; }
      p { margin: 0 0 1.25rem; color: #cbd5e1; line-height: 1.7; }
      .badge { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.65rem 1rem; border-radius: 999px; background: rgba(59, 130, 246, 0.16); color: #93c5fd; font-weight: 700; font-size: 0.95rem; margin-bottom: 1rem; }
      .status { margin: 1rem auto 0; max-width: 620px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(148, 163, 184, 0.25); border-radius: 18px; padding: 1rem 1.15rem; color: #cbd5e1; }
      #adminPanel { margin-top: 1.5rem; display: none; }
      button { border: none; border-radius: 999px; padding: 0.95rem 1.6rem; font-size: 1rem; font-weight: 700; cursor: pointer; color: #fff; background: #10b981; box-shadow: 0 18px 45px rgba(16, 185, 129, 0.22); }
      pre { text-align: left; overflow-x: auto; margin: 1rem auto 0; padding: 1rem; border-radius: 16px; background: rgba(15, 23, 42, 0.88); color: #f8fafc; max-width: 760px; }
      a { color: #93c5fd; text-decoration: none; }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="badge">PCRR-JWT Dispatcher</div>
      <h1>Redirecting you to a random PCRR-JWT route</h1>
      <p id="message">Please wait while we select a live route from the current pool.</p>

      <div id="adminPanel">
        <p>Admin preview mode: explore current routes without automatic redirect.</p>
        <button id="exploreBtn">Explore</button>
        <pre id="routeList" aria-label="Current route list"></pre>
      </div>
    </main>

    <script>
      const defaultRoutes = [
        'https://pcrr-jwt.eu/comm/dream.zone/',
        'https://pcrr-jwt.eu/jwt',
        'https://pcrr-jwt.eu/comm',
        'https://pcrr-jwt.eu/pcrr',
        'https://pcrr-jwt.eu/iteg',
        'https://pcrr-jwt.eu/mbgc',
        'https://pcrr-jwt.eu/pbrc',
        'https://pcrr-jwt.eu/sidr',
        'https://pcrr-jwt.eu/sdgc',
        'https://pcrr-jwt.eu/gsmf',
        'https://pcrr-jwt.eu/gfss'
      ];

      const STORAGE_KEY = 'jwt-dispatcher-routes';
      const LAST_DISPATCH_KEY = 'jwt-dispatcher-last';
      const ROUTES_JSON_PATH = 'routes.json';
      const statusEl = document.getElementById('message');
      const adminPanel = document.getElementById('adminPanel');
      const exploreBtn = document.getElementById('exploreBtn');
      const routeList = document.getElementById('routeList');
      const adminMode = new URL(window.location.href).searchParams.has('admin');

      let routes = [];

      function validUrl(urlString) {
        try {
          new URL(urlString);
          return true;
        } catch {
          return false;
        }
      }

      function persistRoutes() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(routes));
      }

      function setStatus(text, tone = 'idle') {
        statusEl.textContent = text;
        statusEl.style.color = tone === 'error' ? '#fecaca' : '#cbd5e1';
      }

      function loadRoutes() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length) {
              routes = parsed.filter((entry) => typeof entry === 'string' && validUrl(entry));
            }
          } catch {
            routes = [];
          }
        }

        if (!routes.length) {
          routes = defaultRoutes.slice();
          persistRoutes();
          setStatus('Using the default route pool while the live list refreshes.');
          return;
        }

        setStatus(`Loaded ${routes.length} saved route${routes.length === 1 ? '' : 's'} from browser storage.`);
      }

      async function refreshRemoteRoutes() {
        try {
          const response = await fetch(`${ROUTES_JSON_PATH}?t=${Date.now()}`, { cache: 'no-store' });
          if (!response.ok) {
            throw new Error('Failed to fetch live routes.');
          }

          const remote = await response.json();
          if (!Array.isArray(remote) || !remote.length) {
            throw new Error('Live route file is empty or invalid.');
          }

          const updated = remote.filter((entry) => typeof entry === 'string' && validUrl(entry));
          if (!updated.length) {
            throw new Error('No valid URLs found in routes.json.');
          }

          routes = Array.from(new Set(updated));
          persistRoutes();
          setStatus(`Live route pool loaded with ${routes.length} routes.`);
          if (adminMode) {
            routeList.textContent = routes.join('\n');
          }
        } catch (error) {
          console.warn('Route refresh failed:', error);
          if (!routes.length) {
            setStatus('Route refresh failed and no saved routes are available.', 'error');
          }
        }
      }

      function dispatchRandom() {
        if (!routes.length) {
          setStatus('No valid routes are available.', 'error');
          return;
        }

        const nextUrl = routes[Math.floor(Math.random() * routes.length)];
        localStorage.setItem(LAST_DISPATCH_KEY, nextUrl);
        window.location.href = nextUrl;
      }

      function initializeAdminPreview() {
        adminPanel.style.display = 'block';
        exploreBtn.addEventListener('click', dispatchRandom);
        routeList.textContent = routes.join('\n');
        setStatus('Admin preview mode active. Click Explore to test the current route pool.');
      }

      loadRoutes();
      refreshRemoteRoutes();

      if (adminMode) {
        initializeAdminPreview();
      } else {
        dispatchRandom();
      }
    </script>
  </body>
</html>
